apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8sgptclient-remediation
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: registry.hub.docker.com/sanskardevops/k8sgpt-remediation
    argocd-image-updater.argoproj.io/remediation.update-strategy: semver
    argocd-image-updater.argoproj.io/remediation.allow-tags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
spec:
  project: default
  source:
    repoURL: git@github.com:Sanskarzz/k8sgptclient.git 
    targetRevision: main
    path: manifest/k8sgptclient/remediation-server-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: k8sgptclient
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true