apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8sgptclient-agent
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: k8s-agent=sanskardevops/k8s-agent:1.0.0
    argocd-image-updater.argoproj.io/k8s-agent.update-strategy: semver
    argocd-image-updater.argoproj.io/k8s-agent.allow-tags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
    argocd-image-updater.argoproj.io/k8s-agent.pull-secret: pullsecret:argocd/dockerhub-secret
spec:
  project: default
  source:
    repoURL: git@github.com:Sanskarzz/k8sgptclient.git 
    targetRevision: main
    path: manifest/k8sgptclient/agent-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: k8sgptclient
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true